site_name: System in Miniature
site_description: "Teaching kernels of mainstream infrastructure systems, in Python. 主流基础设施系统的 Python 教学内核。"
docs_dir: docs
site_dir: site
exclude_docs: |
  superpowers/
use_directory_urls: false

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.details

  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

