name: Deploy documentation

on:
  # This repository is the organization-root Pages site:
  # system-in-miniature.github.io. Only main may deploy on push.
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - docs-update
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check out project repositories
        env:
          REPOSITORIES: >-
            MiniKafka MiniRedis MiniPostgres MiniQdrant
            MiniLucene MiniDist MiniS3 MiniMongoDB
        run: |
          mkdir -p repos
          for repo in $REPOSITORIES; do
            git clone --depth 1 \
              "https://github.com/system-in-miniature/${repo}.git" \
              "repos/${repo}"
          done

      - name: Sync project documentation
        run: SIM_REPOS_ROOT=repos uv run python sync_docs.py

      - name: Build site
        run: uv run mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
